<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StarNet — equipment review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1016;color:#d2dce2;font:15px Consolas,monospace}header{padding:28px 32px;border-bottom:1px solid #34434e;background:#101821}h1{font-size:25px;font-weight:500;margin:7px 0 12px;letter-spacing:1px}.eyebrow{color:#c5a15c;font-size:11px;letter-spacing:3px}p{color:#91a2ae;line-height:1.6;max-width:900px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}button,a{font:inherit;color:#c5d1da;background:#18232e;border:1px solid #405260;padding:9px 14px;text-decoration:none;cursor:pointer}button[aria-pressed=true]{border-color:#c5a15c;color:#e6c787;background:#2a261e}main{padding:24px 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}article{background:#111a23;border:1px solid #2c3b47;min-width:0}h2{font-size:14px;letter-spacing:1px;margin:0;padding:14px 16px;border-bottom:1px solid #2c3b47}h2 span{float:right;color:#8a9da9;font-size:10px}canvas{display:block;width:100%;image-rendering:pixelated}footer{padding:12px 16px;color:#8194a3;font-size:11px;line-height:1.5}.legend{display:flex;justify-content:space-around;color:#98acbb;font-size:11px;padding:10px}.legend span:last-child{color:#e2c384}
</style>
<header><div class="eyebrow">STARNET / ART REVIEW / 01</div><h1>Workstations & capability equipment</h1><p>Cool satin steel, graphite instrument housings and machined edges. Compare the previous preview with the revised art under identical lighting. Activity here is a visual demonstration, not a live run.</p><nav><button id="idle" aria-pressed="true">Idle</button><button id="active" aria-pressed="false">Active demo</button><button id="redesign" aria-pressed="true">Connector + Core</button><button id="all" aria-pressed="false">All 20</button><button id="workstation" aria-pressed="false">Workstations</button><button id="capability" aria-pressed="false">Capabilities</button><a href="http://127.0.0.1:9177/" target="_blank">Open custom station ↗</a></nav></header><main></main>
<script src="../frontend/js/util.js"></script><script src="../frontend/app/propsprites.js"></script>
<script>
(async()=>{
const shim={exports:{}};const response=await fetch('../.worldshots/equipment-redesign-before.js');if(!response.ok)throw Error('Comparison baseline unavailable');new Function('module','U',await response.text())(shim,U);const before=shim.exports;
const specs=PropSprites.CATALOG.filter(s=>['workstation','capability'].includes(s.cat));let active=false,category='redesign';
const notes={workstation:'Satin desk edge · graphite instrument housing · recessed apron',capability:'Cold steel casing · defined hardware · original capability and footprint'};
function render(){document.querySelector('main').replaceChildren();for(const s of specs.filter(s=>category==='all'||s.cat===category||(category==='redesign'&&['connector_portal','core'].includes(s.id)))){
const card=document.createElement('article');const title=document.createElement('h2');title.textContent=s.label;const tag=document.createElement('span');tag.textContent=s.w+' × '+s.h;title.append(tag);card.append(title);
const legend=document.createElement('div');legend.className='legend';legend.innerHTML='<span>BEFORE</span><span>REVISED</span>';card.append(legend);
const c=document.createElement('canvas');c.width=160;c.height=64;const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.translate(0,-16);
for(let half=0;half<2;half++){const off=half*80;g.fillStyle='#111a23';g.fillRect(off,0,80,80);g.fillStyle='#242e37';g.fillRect(off,44,80,36);g.fillStyle='#1e2831';for(let x=off;x<off+80;x+=24)g.fillRect(x,44,1,36);g.fillStyle='#34424d';g.fillRect(off,44,80,1);const ps=half?PropSprites:before;ps.setCtx(g);ps.setNow(3400);ps.setConnectorState('review-only',active?'online':'offline',3);ps.draw({t:s.id,x:(off+40-s.w*6)/12,y:(62-s.h*12)/12,w:s.w,h:s.h,connectorId:s.id==='connector_portal'&&active?'review-only':null},active,null);}
g.fillStyle='#405260';g.fillRect(79,0,1,80);card.append(c);const footer=document.createElement('footer');footer.textContent=s.id==='connector_portal'?'Recessed socket bank · removable plugs · cable spine':s.id==='core'?'Faceted memory chamber · protective ribs · cooling crowns':notes[s.cat];card.append(footer);document.querySelector('main').append(card);}}
for(const id of ['idle','active'])document.getElementById(id).onclick=()=>{active=id==='active';for(const x of ['idle','active'])document.getElementById(x).setAttribute('aria-pressed',x===id);render();};
for(const id of ['all','workstation','capability','redesign'])document.getElementById(id).onclick=()=>{category=id;for(const x of ['all','workstation','capability','redesign'])document.getElementById(x).setAttribute('aria-pressed',x===id);render();};render();
})().catch(e=>{document.querySelector('main').textContent=e.message;console.error(e);});
</script></html>
